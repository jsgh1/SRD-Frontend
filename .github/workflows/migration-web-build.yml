name: Migration frontend web build
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Type-check and build production React web
        working-directory: apps/web
        run: npm run build
      - name: Run web unit tests with V8 coverage
        working-directory: apps/web
        run: npm run test:coverage
      - name: Publish web coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
          if-no-files-found: ignore
  desktop-url-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify production default and safe development overrides
        working-directory: apps/desktop
        run: node --test tests/*.test.cjs
